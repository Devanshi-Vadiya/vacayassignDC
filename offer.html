<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coca-Cola Offerings (Clone)</title>
  <style>
    /* ========== BASE STYLES ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background-color: #111;
  color: #fff;
  line-height: 1.6;
}

/* ========== HEADER ========== */
.site-header {
  background: #000;
  position: sticky;
  top: 0;
  z-index: 1000;
  width: 100%;
  border-bottom: 1px solid #222;
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo img {
  height: 35px;
  filter: brightness(0) invert(1);
}

.main-nav ul {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.main-nav a {
  text-decoration: none;
  color: #ccc;
  font-weight: 500;
  transition: color 0.3s ease;
}

.main-nav a:hover {
  color: #76b900;
}

.utility-nav {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.utility-link {
  text-decoration: none;
  color: #fff;
  font-weight: 500;
}

.menu-btn {
  display: none;
  background: none;
  border: none;
  color: #fff;
  font-size: 1.8rem;
  cursor: pointer;
}

/* ========== HERO SECTION ========== */
.hero-banner {
  background: linear-gradient(120deg, #0a0a0a, #141414);
  text-align: center;
  padding: 6rem 2rem;
}

.hero-banner .category {
  color: #76b900;
  font-weight: 600;
  font-size: 0.9rem;
  letter-spacing: 1px;
}

.hero-banner h1 {
  font-size: 2.5rem;
  margin: 1rem 0;
  color: #fff;
}

.hero-banner p {
  color: #bbb;
  font-size: 1rem;
  max-width: 600px;
  margin: 0 auto 1.5rem;
}

.learn-more {
  display: inline-block;
  padding: 0.75rem 1.5rem;
  background: #76b900;
  color: #000;
  border-radius: 5px;
  text-decoration: none;
  font-weight: 600;
  transition: background 0.3s;
}

.learn-more:hover {
  background: #94d127;
}

/* ========== FEATURED SECTION ========== */
.section-wrapper {
  max-width: 1200px;
  margin: 4rem auto;
  padding: 0 2rem;
}

.header-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
}

.section-title {
  font-size: 1.8rem;
  color: #fff;
}

.quick-links {
  color: #76b900;
  text-decoration: none;
  font-weight: 500;
}

.content-layout {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 3rem;
}

.text-column {
  flex: 1;
  color: #ccc;
}

.cards-column {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2rem;
  flex: 1;
}

.card {
  background: #1a1a1a;
  border-radius: 12px;
  text-decoration: none;
  color: #fff;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
}

.card-image {
  background-size: cover;
  background-position: center;
  height: 160px;
}

#img-gamescom {
  background-image: url("https://images.nvidia.com/aem-dam/Solutions/geforce/news/gamescom-2023/gamescom-2023-key-visual-2560-d.jpg");
}

#img-llm-cloud {
  background-image: url("https://images.nvidia.com/aem-dam/en-zz/Solutions/technologies/cloud-gaming/cloud-gaming-og-image-2048x1152.jpg");
}

.card-content {
  padding: 1rem 1.2rem;
}

.card-tags {
  color: #76b900;
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 0.4rem;
}

.card-headline {
  font-size: 1.2rem;
  margin-bottom: 0.4rem;
}

/* ========== FOOTER ========== */
.footer {
  background: #000;
  text-align: center;
  padding: 2rem;
  color: #777;
  font-size: 0.9rem;
  border-top: 1px solid #222;
}

/* ========== MEDIA QUERIES ========== */

/* Tablets */
@media (max-width: 1024px) {
  .header-inner {
    flex-wrap: wrap;
  }

  .main-nav ul {
    gap: 1.5rem;
  }

  .content-layout {
    flex-direction: column;
  }

  .cards-column {
    grid-template-columns: 1fr 1fr;
  }
}

/* Mobile */
@media (max-width: 768px) {
  .main-nav ul {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 70px;
    right: 0;
    background: #000;
    width: 100%;
    text-align: center;
    border-top: 1px solid #222;
  }

  .main-nav.active ul {
    display: flex;
  }

  .menu-btn {
    display: block;
  }

  .utility-link {
    display: none;
  }

  .hero-banner {
    padding: 4rem 1rem;
  }

  .hero-banner h1 {
    font-size: 1.8rem;
  }

  .section-wrapper {
    margin: 2rem auto;
  }

  .content-layout {
    flex-direction: column;
    gap: 2rem;
  }

  .cards-column {
    grid-template-columns: 1fr;
  }

  .card-image {
    height: 200px;
  }

  .header-controls {
    flex-direction: column;
    align-items: flex-start;
    gap: 1rem;
  }
}


@media (max-width: 480px) {
  .hero-banner h1 {
    font-size: 1.5rem;
  }

  .learn-more {
    padding: 0.6rem 1.2rem;
    font-size: 0.9rem;
  }

  .section-title {
    font-size: 1.4rem;
  }

  .card-headline {
    font-size: 1rem;
  }
}

  </style>
